<!--Header-->
<header [ngClass]="{'centered':mobile}">
  <a routerLink="">
    <img src="assets/images/logo-nav@2x.png" alt="Home" title="Home" style="height: 60px;" />
  </a>
  @if (!mobile) {
    <nav>
      <a routerLink=""><fa-icon [icon]="faHouse"></fa-icon>Home</a>
      <a routerLink="/profiles"><fa-icon [icon]="faUser"></fa-icon>Profiles</a>
      <a routerLink="/timeline"><fa-icon [icon]="faTimeline"></fa-icon>Timeline</a>
    </nav>
  }
</header>
<!--Content-->
<router-outlet></router-outlet>
<!--Footer-->
@if (!mobile) {
  <footer>
    <a href="/">
      <img src="assets/images/logo-small.png" alt="Home" title="Home" style="height: 40px; margin: 10px;" />
    </a>
    <div>© 2024 Marvin Henßer</div>
  </footer>
}
@if (mobile) {
  <footer>
    <nav class="mobile" >
      <a routerLink="/profiles"><fa-icon [icon]="faUser"></fa-icon></a>
      <a routerLink="">
        <img src="assets/images/logo-small.png" alt="Home" title="Home" style="height: 40px; margin: 10px;" />
      </a>
      <a routerLink="/timeline"><fa-icon [icon]="faTimeline"></fa-icon></a>
    </nav>
  </footer>
}
