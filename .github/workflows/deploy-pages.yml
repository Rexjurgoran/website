name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Install Chromium for Karma
        run: |
          sudo apt-get update
          (sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium)

      - name: Run unit tests
        run: |
          CHROME_BIN=$(which chromium-browser || which chromium || which google-chrome || which google-chrome-stable)
          if [ -z "$CHROME_BIN" ]; then
            echo "No Chrome or Chromium binary found"
            exit 1
          fi
          echo "Using Chrome binary: $CHROME_BIN"
          CHROME_BIN="$CHROME_BIN" npm run test -- --watch=false --browsers=ChromeHeadlessNoSandbox

      - name: Build Angular app for Pages
        run: npm run build:pages

      - name: Inspect built site
        run: |
          ls -al docs || (echo "docs/ missing" && exit 1)
          test -f docs/index.html || (echo "docs/index.html missing" && exit 1)
          du -sh docs || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          wait-for-deployment: false
